paths:
  /api/auth/login:
    post:
      summary: Login
      responses:
        "200":
          description: Insufficient data to verify response schema.
  /api/auth/register:
    post:
      summary: Register
      responses:
        "200":
          description: Insufficient data to verify response schema.
  /api/v1/invitations:
    post:
      summary: Create invitation
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Insufficient data to verify response schema.
  /api/v1/invitations/my:
