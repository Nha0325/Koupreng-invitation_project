        "200":
          description: Insufficient data to verify response schema.
    put:
      summary: Update invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/invitationId"
      responses:
        "200":
          description: Insufficient data to verify response schema.
