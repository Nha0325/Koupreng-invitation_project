name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd apps/backend
          ./mvnw -DskipTests compile

      - name: Run Tests
        run: |
          cd apps/backend
          ./mvnw test

  frontend-user:
    name: Frontend User Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend-user/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/frontend-user
          npm ci

      - name: Build Production Bundle
        run: |
          cd apps/frontend-user
          npm run build

  frontend-admin:
    name: Frontend Admin Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend-admin/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/frontend-admin
          npm ci

      - name: Build Production Bundle
        run: |
          cd apps/frontend-admin
          npm run build

  telegram-bot:
    name: Telegram Bot Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/telegram-bot/requirements.txt

      - name: Install Dependencies
        run: |
          cd apps/telegram-bot
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile Python
        run: |
          cd apps/telegram-bot
          python -m py_compile main.py

  smoke-tests:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend-user, frontend-admin]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Frontend User Dependencies and Build
        run: |
          cd apps/frontend-user
          npm ci
          npm run build

      - name: Install Frontend Admin Dependencies and Build
        run: |
          cd apps/frontend-admin
          npm ci
          npm run build

      - name: Run Browser Smoke Test
        run: |
          node scripts/browser-smoke.mjs
