spring.application.name=backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/koupreng_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Phnom_Penh&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:school}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.jackson.time-zone=Asia/Phnom_Penh
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:25MB}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:koupreng-backend}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:60}
app.password-reset-token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:30}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
app.password-reset.email-from=${PASSWORD_RESET_EMAIL_FROM:no-reply@koupreng.local}
app.password-reset.log-token-in-development=${PASSWORD_RESET_LOG_TOKEN_IN_DEVELOPMENT:false}
app.auth.first-user-admin-enabled=${FIRST_USER_ADMIN_ENABLED:false}

app.security.cors.enabled=${CORS_ENABLED:true}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
app.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,X-Request-Id}
app.security.cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Request-Id}
app.security.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:1800}
app.security.https.required=${HTTPS_REQUIRED:false}
app.security.https.hsts-enabled=${HSTS_ENABLED:true}
app.security.https.hsts-max-age-seconds=${HSTS_MAX_AGE_SECONDS:31536000}
app.security.logging.enabled=${API_LOGGING_ENABLED:true}
app.security.logging.include-query-string=${API_LOGGING_INCLUDE_QUERY_STRING:false}
app.security.logging.include-health-checks=${API_LOGGING_INCLUDE_HEALTH_CHECKS:false}
app.security.upload.enabled=${UPLOAD_VALIDATION_ENABLED:true}
app.security.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
app.security.upload.max-files=${UPLOAD_MAX_FILES:5}
app.security.upload.allowed-content-types=${UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,application/pdf}
app.security.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:.jpg,.jpeg,.png,.webp,.pdf}
app.security.upload.verify-signatures=${UPLOAD_VERIFY_SIGNATURES:true}

app.waf.enabled=${WAF_ENABLED:true}
app.waf.audit-only=${WAF_AUDIT_ONLY:false}
app.waf.protected-path-prefixes=${WAF_PROTECTED_PATH_PREFIXES:/api}
app.waf.allowed-methods=${WAF_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
app.waf.max-uri-length=${WAF_MAX_URI_LENGTH:2048}
app.waf.max-query-length=${WAF_MAX_QUERY_LENGTH:2048}
app.waf.max-body-bytes=${WAF_MAX_BODY_BYTES:65536}
app.waf.max-header-value-length=${WAF_MAX_HEADER_VALUE_LENGTH:4096}
app.waf.max-header-count=${WAF_MAX_HEADER_COUNT:80}
app.waf.max-requests-per-minute=${WAF_MAX_REQUESTS_PER_MINUTE:120}
