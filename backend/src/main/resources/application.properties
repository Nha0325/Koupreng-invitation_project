spring.application.name=backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.port=8080

# Monitoring
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:true}
management.defaults.metrics.export.enabled=${MANAGEMENT_METRICS_EXPORT_ENABLED:true}
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
info.app.name=${spring.application.name}
info.app.description=Koupreng invitation backend

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/koupreng_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Phnom_Penh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.data.redis.repositories.enabled=false
spring.jackson.time-zone=Asia/Phnom_Penh
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:60MB}
app.jwt.issuer=${JWT_ISSUER:koupreng-backend}
app.jwt.secret=${JWT_SECRET:change_this_to_a_random_64_character_or_longer_secret}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.auth.cookie.enabled=${AUTH_COOKIE_ENABLED:false}
app.auth.cookie.name=${AUTH_COOKIE_NAME:koupreng_access_token}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.http-only=${AUTH_COOKIE_HTTP_ONLY:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.max-age-seconds=${AUTH_COOKIE_MAX_AGE_SECONDS:900}
app.auth.first-user-admin-enabled=${FIRST_USER_ADMIN_ENABLED:false}
app.auth.max-login-attempts-per-minute=${AUTH_MAX_LOGIN_ATTEMPTS_PER_MINUTE:10}
app.auth.max-register-attempts-per-minute=${AUTH_MAX_REGISTER_ATTEMPTS_PER_MINUTE:5}
app.auth.max-social-login-attempts-per-minute=${AUTH_MAX_SOCIAL_LOGIN_ATTEMPTS_PER_MINUTE:20}
app.oauth.google.client-ids=${GOOGLE_CLIENT_IDS:}
app.oauth.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
app.oauth.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.oauth.telegram.auth-max-age-seconds=${TELEGRAM_AUTH_MAX_AGE_SECONDS:86400}
app.oauth.telegram.email-domain=${TELEGRAM_EMAIL_DOMAIN:telegram.local}
app.oauth.telegram.client-id=${TELEGRAM_CLIENT_ID:}
app.oauth.telegram.jwk-set-uri=${TELEGRAM_JWK_SET_URI:https://oauth.telegram.org/.well-known/jwks.json}
app.rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
app.rate-limit.redis-key-prefix=${RATE_LIMIT_REDIS_KEY_PREFIX:koupreng:rate-limit:}
app.rate-limit.fail-closed=${RATE_LIMIT_FAIL_CLOSED:true}

# Media storage
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.upload-dir=${LOCAL_UPLOAD_DIR:uploads}
app.storage.local.public-base-url=${PUBLIC_UPLOAD_BASE_URL:http://localhost:8080/uploads}
app.storage.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.storage.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.storage.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.storage.cloudinary.folder=${CLOUDINARY_FOLDER:koupreng}

# ABA PayWay sandbox template/package payments. Keys are read from env only.
app.payment.payway.merchant-id=${ABA_PAYWAY_MERCHANT_ID:}
app.payment.payway.public-key=${ABA_PAYWAY_PUBLIC_KEY:}
app.payment.payway.rsa-public-key=${ABA_PAYWAY_RSA_PUBLIC_KEY:}
app.payment.payway.rsa-private-key=${ABA_PAYWAY_RSA_PRIVATE_KEY:}
app.payment.payway.api-url=${ABA_PAYWAY_API_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase}
app.payment.payway.return-url=${ABA_PAYWAY_RETURN_URL:http://localhost:5173/payments/return}
app.payment.payway.cancel-url=${ABA_PAYWAY_CANCEL_URL:http://localhost:5173/payments/cancel}
app.payment.payway.continue-success-url=${ABA_PAYWAY_CONTINUE_SUCCESS_URL:http://localhost:5173/payments/success}
app.payment.payway.callback-url=${ABA_PAYWAY_CALLBACK_URL:http://localhost:8080/api/v1/payway/callback}
app.payment.payway.sandbox=${ABA_PAYWAY_SANDBOX:true}
app.payment.payway.payment-option=${ABA_PAYWAY_PAYMENT_OPTION:abapay_deeplink}
app.payment.payway.order-expiry-minutes=${PAYMENT_ORDER_EXPIRY_MINUTES:15}
app.payment.admin-secret=${ADMIN_PAYMENT_SECRET:change-me-local-only}
app.payment.auto-confirm-telegram-detected=${AUTO_CONFIRM_TELEGRAM_DETECTED:false}
app.payment.order-expiry-minutes=${PAYMENT_ORDER_EXPIRY_MINUTES:15}

# API security
app.security.cors.enabled=${CORS_ENABLED:true}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
app.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With,X-Request-Id}
app.security.cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Request-Id}
app.security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
app.security.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:1800}
app.security.https.required=${HTTPS_REQUIRED:false}
app.security.https.hsts-enabled=${HSTS_ENABLED:true}
app.security.https.hsts-max-age-seconds=${HSTS_MAX_AGE_SECONDS:31536000}
app.security.logging.enabled=${API_LOGGING_ENABLED:true}
app.security.logging.include-query-string=${API_LOGGING_INCLUDE_QUERY_STRING:false}
app.security.logging.include-health-checks=${API_LOGGING_INCLUDE_HEALTH_CHECKS:false}
app.security.upload.enabled=${UPLOAD_VALIDATION_ENABLED:true}
app.security.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:5242880}
app.security.upload.max-files=${UPLOAD_MAX_FILES:5}
app.security.upload.allowed-content-types=${UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,application/pdf}
app.security.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:.jpg,.jpeg,.png,.webp,.pdf}
app.security.upload.verify-signatures=${UPLOAD_VERIFY_SIGNATURES:true}
app.security.client-address.forwarded-headers-enabled=${CLIENT_ADDRESS_FORWARDED_HEADERS_ENABLED:false}

# WAF
app.waf.enabled=${WAF_ENABLED:true}
app.waf.audit-only=${WAF_AUDIT_ONLY:false}
app.waf.protected-path-prefixes=${WAF_PROTECTED_PATH_PREFIXES:/api}
app.waf.allowed-methods=${WAF_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
app.waf.max-uri-length=${WAF_MAX_URI_LENGTH:2048}
app.waf.max-query-length=${WAF_MAX_QUERY_LENGTH:2048}
app.waf.max-body-bytes=${WAF_MAX_BODY_BYTES:65536}
app.waf.max-header-value-length=${WAF_MAX_HEADER_VALUE_LENGTH:4096}
app.waf.max-header-count=${WAF_MAX_HEADER_COUNT:80}
app.waf.max-requests-per-minute=${WAF_MAX_REQUESTS_PER_MINUTE:120}
