# Khmer message bundle (ភាសាខ្មែរ)
# Stored as UTF-8. The MessageSource bean is configured with UTF-8 encoding.

# Generic / greeting
app.welcome=សូមស្វាគមន៍មកកាន់ Koupreng
app.language.current=ភាសាបច្ចុប្បន្នគឺ ភាសាខ្មែរ

# Common API success messages
common.success=ជោគជ័យ
common.created=បានបង្កើតដោយជោគជ័យ
common.updated=បានកែប្រែដោយជោគជ័យ
common.deleted=បានលុបដោយជោគជ័យ

# Error handler messages
error.request.unprocessable=មិនអាចដំណើរការសំណើបានទេ
error.validation.failed=ការផ្ទៀងផ្ទាត់បរាជ័យ
error.json.malformed=ខ្លឹមសារសំណើមិនត្រឹមត្រូវ
error.method.notSupported=មិនគាំទ្រវិធីសាស្ត្រសំណើនេះទេ
error.mediaType.notSupported=មិនគាំទ្រប្រភេទខ្លឹមសារនេះទេ
error.resource.notFound=រកមិនឃើញធនធានទេ
error.upload.tooLarge=ឯកសារដែលបានផ្ទុកឡើងមានទំហំធំពេក
error.multipart.failed=មិនអាចដំណើរការសំណើ multipart បានទេ
error.auth.required=ត្រូវការការផ្ទៀងផ្ទាត់អត្តសញ្ញាណ
error.access.denied=អ្នកមិនមានសិទ្ធិធ្វើសកម្មភាពនេះទេ
error.server.unexpected=មានបញ្ហាមិនរំពឹងទុកនៅលើម៉ាស៊ីនមេ
error.rateLimit.exceeded=សំណើច្រើនពេក។ សូមព្យាយាមម្តងទៀតនៅពេលក្រោយ។
